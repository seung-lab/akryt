[package]
name = "akryt"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-channel = "0.5.17"
humantime-serde = "1.1.1"
image = "0.25.10"
jpegxl-rs = { version = "0.14.0", features = ["vendored"] }
notify = "8.2.0"
serde = { version = "1", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.1.6"
walkdir = "2.5.0"

[profile.dev]
opt-level = 1
